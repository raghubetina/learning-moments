name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + audit on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in package.json `engines`; 24 is the
        # Node line the publish workflow uses; 26 is the current release.
        node-version: ["22", "24", "26"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies without running lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run check

      - name: Run the test suite
        run: npm test

      - name: Verify file integrity against MANIFEST.json
        run: node src/cli.js audit
